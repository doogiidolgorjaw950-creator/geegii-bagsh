<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ээлжит Хичээлийн Төлөвлөлт & Цахим Хичээл | Гээгий багшийн бүтээл</title>
<style>
  :root {
    --bg: #f1f5f9;
    --ink: #173042;
    --brand: #0c7b93;
    --warm: #f48c06;
    --vowel: #dc2626;
    --cons: #1d4ed8;
    --ok: #16a34a;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(135deg, #173042, #0c7b93);
    color: #fff;
    padding: 13px 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.16);
  }
  header h1 { margin: 0; font-size: 17.5px; }
  header small { display: block; opacity: .9; font-size: 11.5px; }

  .mode-tabs {
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,.15);
    padding: 4px;
    border-radius: 12px;
  }
  .m-btn {
    border: 0;
    border-radius: 9px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    background: transparent;
    color: #fff;
  }
  .m-btn.active { background: #fff; color: var(--ink); }

  main { max-width: 1060px; margin: 18px auto; padding: 0 14px 50px; }

  .selector-bar {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .subj-pills, .topic-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pill {
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    border-radius: 10px;
    padding: 7px 12px;
    font-weight: 800;
    font-size: 12.5px;
    cursor: pointer;
  }
  .pill.active {
    background: #0c7b93;
    color: #fff;
    border-color: #0c7b93;
  }
  .pill.t-active {
    background: #f48c06;
    color: #fff;
    border-color: #f48c06;
  }

  .btn {
    border: 0;
    border-radius: 10px;
    padding: 9px 15px;
    font-weight: 900;
    font-size: 13px;
    cursor: pointer;
    color: #fff;
    background: var(--brand);
  }
  .btn-warm { background: var(--warm); }
  .btn-ok { background: var(--ok); }

  .a4-plan {
    background: #fff;
    border: 2px solid #94a3b8;
    border-radius: 18px;
    padding: 24px 26px;
    box-shadow: 0 10px 25px rgba(0,0,0,.07);
  }
  .plan-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2.5px solid #173042;
    padding-bottom: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .plan-head h2 { margin: 0 0 4px; font-size: 20px; color: #0c7b93; }
  .meta-box {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;
    font-weight: 700;
  }
  @media (max-width: 680px) { .meta-box { grid-template-columns: 1fr; } }

  .plan-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .plan-table th, .plan-table td {
    border: 1.5px solid #94a3b8;
    padding: 10px 12px;
    vertical-align: top;
    line-height: 1.5;
  }
  .plan-table th {
    background: #e0f2fe;
    color: #0369a1;
    font-weight: 900;
    text-align: left;
  }

  .slide-stage {
    background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
    border: 3.5px solid #0c7b93;
    border-radius: 26px;
    padding: 28px 24px;
    min-height: 440px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 14px 32px rgba(12,123,147,.14);
    text-align: center;
  }
  .slide-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 900;
    color: #0369a1;
    border-bottom: 2px dashed #bae6fd;
    padding-bottom: 10px;
  }
  .slide-body {
    padding: 18px 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
  .slide-ico { font-size: 68px; margin-bottom: 10px; }
  .slide-title { font-size: 26px; font-weight: 900; color: #173042; margin: 0 0 12px; }
  .slide-content {
    font-size: 20px;
    font-weight: 700;
    line-height: 1.65;
    max-width: 780px;
    background: #fff;
    border: 2px solid #bae6fd;
    border-radius: 18px;
    padding: 18px 22px;
  }
  .slide-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 14px;
    border-top: 2px dashed #bae6fd;
  }
  .quiz-opts {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 14px;
  }
  .q-opt {
    padding: 10px 18px;
    border-radius: 12px;
    border: 2px solid #0c7b93;
    background: #e0f2fe;
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }
  .q-opt.correct { background: #16a34a; color: #fff; border-color: #15803d; }

  @media print {
    header, .selector-bar, .no-print { display: none !important; }
    body { background: #fff; }
    main { margin: 0; padding: 0; max-width: 100%; }
    .a4-plan { border: 0; box-shadow: none; padding: 4mm; }
  }
</style>
</head>
