<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Байгаль шинжлэл • Нийгэм • Эрүүл мэнд | Гээгий багшийн бүтээл</title>
<style>
  :root {
    --bg: #eef7fb;
    --ink: #173042;
    --brand: #0c7b93;
    --green: #15803d;
    --gold: #f48c06;

    --bad: #dc2626;
    --border: #c5dce8;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;

  }
  header {
    background: linear-gradient(135deg, #14532d, #0c7b93);

    padding: 13px 20px;

  }

    padding: 8px 12px;
    font-weight: 800;
    font-size: 12.5px;

    color: #fff;

  .hud {

    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 11px 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;

    gap: 12px;
    margin-bottom: 16px;
  }
  .board {
    background: #fff;
    border: 3px solid #2b5876;
    border-radius: 24px;
    padding: 24px 18px;
    text-align: center;
    box-shadow: 0 10px 26px rgba(23,48,66,.1);
  }
  .topic-tag {
    display: inline-block;
    background: #dcfce7;

    font-weight: 900;
    font-size: 12.5px;
    padding: 5px 14px;

    margin-bottom: 10px;
  }

  .q-txt { font-size: 20px; font-weight: 900; margin: 8px 0 16px; line-height: 1.4; }

  .opt-grid {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    max-width: 680px;
    margin: 0 auto;
  }
  .opt-btn {
    min-width: 150px;
    padding: 12px 18px;
    border-radius: 15px;
    border: 2.5px solid #0c7b93;
    background: linear-gradient(180deg, #fff, #e0f2fe);
    font-size: 16.5px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 0 #0c7b93;
    transition: transform .1s;
  }
  .opt-btn:hover:not(:disabled) { transform: translateY(-2px); background: #bae6fd; }
  .opt-btn.ok { background: var(--ok); color: #fff; border-color: #15803d; box-shadow: 0 4px 0 #15803d; }
  .opt-btn.no { background: #fee2e2; color: var(--bad); border-color: var(--bad); box-shadow: 0 4px 0 var(--bad); }

  .next-btn {
    background: var(--gold);
    color: #fff;
    border: 0;
    border-radius: 14px;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 900;

</style>

<script>
// Web Audio API (Интернэтгүй үед ч дуугарах баярын ба алдааны аялгуу)
let soundOn = true;
function playTone(isOk) {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (isOk) {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.14, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.28);
      osc.start();
      osc.stop(ctx.currentTime + 0.28);
    }
  } catch (e) {}
}

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundBtn').textContent = soundOn ? '🔊 Дуу: АСААЛТТАЙ' : '🔇 Дуу: ХААЛТТАЙ';
}

    ]
  },

  // 3. ЭРҮҮЛ МЭНД БА АЮУЛГҮЙ БАЙДАЛ (12 дасгал)

const PRAISES = [
  "🌟 Гайхалтай! Яг зөв хариуллаа!",
  "🎉 Браво! Чи үнэхээр ухаалаг хүүхэд юм!",
  "👏 Зөв байна! +10 оноо нэмэгдлээ!",
  "✨ Гээгий багш чамаар бахархаж байна!",
  "🏆 Онц! Дараагийн дасгал руу орцгооё!"
];

let mode = 0; // 0 = Байгаль шинжлэл, 1 = Нийгэм, 2 = Эрүүл мэнд
let idx = 0;
let lives = 5;
let score = 0;
let solved = false;
let wrongOpts = new Set();

function setMode(m) {
  mode = m;
  idx = 0;
  lives = 5;
  score = 0;
  solved = false;
  wrongOpts.clear();
  [0, 1, 2].forEach(i => document.getElementById(`m${i}`).classList.toggle('active', i === mode));
  render();
}

function chooseOpt(optIdx) {
  if (solved || lives <= 0) return;
  const item = TOPICS[mode].items[idx];
  const chosen = item.opts[optIdx];

  if (chosen === item.ans) {
    solved = true;
    score += 10;
    playTone(true);
    const praise = PRAISES[Math.floor(Math.random() * PRAISES.length)];
    render(`${praise} (+10 оноо)`, true);
  } else {
    wrongOpts.add(chosen);
    lives--;
    playTone(false);
    if (lives <= 0) {
      renderGameOver();
    } else {
      render(`❌ Буруу байна. Дахин бодоод үзээрэй! (Үлдсэн амь: ${lives})`, false);
    }
  }
}

function nextItem() {
  const list = TOPICS[mode].items;
  if (idx + 1 < list.length) {
    idx++;
    solved = false;
    wrongOpts.clear();
    render();
  } else {
    renderWin();
  }
}

function render(msg = '', isOk = true) {
  const app = document.getElementById('app');
  const curTopic = TOPICS[mode];
  const item = curTopic.items[idx];
  const hearts = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 5 - lives));

  const optsHtml = item.opts.map((o, i) => {
    const okCls = solved && o === item.ans ? 'ok' : '';
    const noCls = wrongOpts.has(o) ? 'no' : '';
    return `<button class="opt-btn ${okCls} ${noCls}" ${solved ? 'disabled' : ''} onclick="chooseOpt(${i})">${o}</button>`;
  }).join('');

  app.innerHTML = `
    <div class="hud">
      <div style="font-size:21px;letter-spacing:2px">${hearts}</div>
      <div style="font-weight:800;color:#0c7b93">Дасгал: ${idx + 1} / ${curTopic.items.length}</div>
      <div style="background:#fef3c7;border:2px solid #f59e0b;color:#92400e;font-weight:900;padding:5px 14px;border-radius:20px">⭐ Оноо: ${score}</div>
    </div>
    <div class="board">
      <div class="topic-tag" style="background:${curTopic.badgeBg};color:${curTopic.badgeColor}">${curTopic.name} • ${item.sub}</div>
      <div class="big-ico">${item.ico}</div>
      <div class="q-txt">${item.q}</div>
      <div class="opt-grid">${optsHtml}</div>
      <div style="min-height:30px;margin-top:14px;font-size:17px;font-weight:900;color:${isOk ? '#16a34a' : '#dc2626'}">${msg}</div>
      ${solved ? `<button class="next-btn" onclick="nextItem()">Дараагийн дасгал ▶</button>` : ''}
    </div>
  `;
}

function renderWin() {
  const stars = lives === 5 ? '⭐⭐⭐' : lives >= 3 ? '⭐⭐' : '⭐';
  const curTopic = TOPICS[mode];
  document.getElementById('app').innerHTML = `
    <div class="board" style="padding:36px 20px">
      <div style="font-size:50px">${stars}</div>
      <h2 style="color:#16a34a;font-size:26px">БАЯР ХҮРГЭЕ! «${curTopic.name}» бүлгийг амжилттай дүүргэлээ!</h2>
      <p style="font-size:17px;font-weight:700">Нийт оноо: <b>${score}</b></p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="next-btn" style="background:#64748b;box-shadow:none" onclick="setMode(${mode})">🔁 Дахин тоглох</button>
        ${mode < 2 ? `<button class="next-btn" onclick="setMode(${mode + 1})">Дараагийн сэдэв рүү ▶</button>` : `<button class="next-btn" onclick="setMode(0)">🌿 Эхнээс нь тоглох</button>`}
      </div>
    </div>
  `;
}

function renderGameOver() {
  document.getElementById('app').innerHTML = `
    <div class="board" style="padding:36px 20px">
      <div style="font-size:50px">💔😢</div>
      <h2 style="color:#dc2626;font-size:26px">Амь дууслаа!</h2>
      <p style="font-size:16px;font-weight:700">Санаа бүү зов! Дахин оролдоод бүх зүрхээ хадгалж үзээрэй. Оноо: <b>${score}</b></p>
      <button class="next-btn" onclick="setMode(${mode})">🔄 Дахин эхлэх</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
