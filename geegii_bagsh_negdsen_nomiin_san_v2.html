<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гээгий багшийн бүтээл • Нэгдсэн цахим номын сан (55 цуврал)</title>
<style>
  :root {
    --bg: #eef7fb;
    --ink: #173042;
    --brand: #0c7b93;
    --brand2: #f48c06;
    --vowel: #d62828;
    --cons: #1d4ed8;
    --sign: #6d28d9;
    --num: #e63946;
    --syl: #0f766e;
    --card: #ffffff;
    --border: #c5dce8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(135deg, #173042, #0c7b93);
    color: #fff;
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 30;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 18px; }
  header small { display: block; opacity: .88; font-size: 11.5px; }

  .mode-tabs {
    display: flex;
    flex-wrap: wrap;
    background: rgba(255,255,255,.15);
    padding: 4px;
    border-radius: 12px;
    gap: 4px;
  }
  .tab-btn {
    border: 0;
    border-radius: 9px;
    padding: 7px 12px;
    font-weight: 800;
    font-size: 12.5px;
    cursor: pointer;
    background: transparent;
    color: #fff;
    transition: all .15s;
  }
  .tab-btn.active {
    background: #fff;
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(0,0,0,.15);
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #fff;
    color: var(--ink);
  }
  .btn:hover { opacity: .92; }
  .btn.primary { background: var(--brand2); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }

  .selector-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }
  .chip {
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #f8fbfd;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    padding: 0 8px;
  }
  .chip.vowel { color: var(--vowel); }
  .chip.cons { color: var(--cons); }
  .chip.sign { color: var(--sign); }
  .chip.num { color: var(--brand); min-width: 42px; font-size: 16px; }
  .chip.syl { color: var(--syl); font-size: 13px; }
  .chip.active {
    background: var(--ink);
    color: #fff !important;
    border-color: var(--ink);
    transform: scale(1.06);
  }

  main { max-width: 1280px; margin: 16px auto; padding: 0 14px 40px; }

  .brand-banner {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 10px 16px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
  }
  .principles span {
    background: #f0f9ff;
    border: 1px solid #bae6fd;
    padding: 3px 9px;
    border-radius: 20px;
    margin-right: 4px;
    display: inline-block;
    margin-top: 2px;
    font-weight: 600;
  }

  .comic-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 1024px) { .comic-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .comic-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 3px solid #2b5876;
    border-radius: 18px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 330px;
    box-shadow: 0 6px 16px rgba(23,48,66,.08);
  }
  .panel.cover {
    background: linear-gradient(180deg, #dff3ff 0%, #fff6d6 65%, #d8f3dc 100%);
    text-align: center;
  }
  .ribbon {
    background: linear-gradient(90deg, #ffba08, #faa307);
    color: #173042;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    margin-bottom: 8px;
  }
  .big-symbol {
    font-size: 64px;
    font-weight: 900;
    line-height: 1.05;
    margin: 4px 0;
    text-shadow: 2px 3px 0 rgba(0,0,0,.1);
  }
  .vowel-txt { color: var(--vowel); }
  .cons-txt { color: var(--cons); }
  .sign-txt { color: var(--sign); }
  .num-txt { color: var(--num); }
  .syl-txt { color: var(--syl); }

  .emoji-stage {
    font-size: 42px;
    text-align: center;
    margin: 6px 0;
    line-height: 1.25;
    user-select: none;
  }
  .ten-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #f1f5f9;
    border: 2px solid #94a3b8;
    border-radius: 10px;
    padding: 5px;
    margin: 6px auto;
    width: 100%;
    max-width: 210px;
  }
  .tf-cell {
    height: 23px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }
  .tf-cell.filled { background: #ffe5e5; border-color: #e63946; }

  .word-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 6px 0;
  }
  .w-card {
    background: #f8fbfd;
    border: 1.5px solid #d5e6f0;
    border-radius: 12px;
    padding: 7px;
    text-align: center;
  }
  .w-card .ico { font-size: 24px; display: block; }
  .w-card strong { font-size: 14px; }

  .syl-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin: 6px 0;
  }
  .syl-pill {
    background: #f0fdfa;
    border: 2px solid #5eead4;
    border-radius: 12px;
    padding: 5px 10px;
    font-size: 17px;
    font-weight: 900;
  }

  .bubble {
    background: #fff;
    border: 2px solid #8ecae6;
    border-radius: 16px;
    padding: 9px 11px;
    font-size: 13.5px;
    line-height: 1.45;
    margin: 6px 0;
  }
  .checklist {
    list-style: none;
    padding: 0;
    margin: 6px 0;
    font-size: 13px;
  }
  .checklist li {
    background: #f1faee;
    border-radius: 10px;
    padding: 6px 9px;
    margin-bottom: 6px;
  }

  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #d5e6f0;
    font-size: 11px;
    color: #64748b;
  }
  .page-num {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #ffba08;
    color: #173042;
    font-weight: 800;
    font-size: 12.5px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .quiz-btns { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin: 6px 0; }
  .q-btn {
    min-width: 32px; height: 32px; border-radius: 9px;
    border: 1.5px solid #94a3b8; background: #fff;
    font-weight: 800; font-size: 13.5px; cursor: pointer; padding: 0 7px;
  }
  .q-btn.ok { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }
  .q-btn.no { background: #ffe5e5; border-color: #e63946; }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #f8fbfd; border-radius: 8px; padding: 4px 8px; margin: 4px 0; font-size: 13px;
  }
  .match-row button {
    border: 1px solid #94a3b8; background: #fff; border-radius: 6px; padding: 2px 7px; cursor: pointer; font-weight: 700;
  }
  .match-row button.matched { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }

  @media print {
    header, .selector-bar, .brand-banner { display: none !important; }
    body { background: #fff; }
    main { margin: 0; padding: 0; max-width: 100%; }
    .comic-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .panel { min-height: 255px; break-inside: avoid; box-shadow: none; border-width: 2px; }
  }
</style>
</head>

<header>
  <div>
    <h1>📚 Гээгий багшийн бүтээл — Миний бяцхан номын сан</h1>

  return [...word].map(ch => {
    if (ch === '-' || ch === ' ') return ch;
    if (VOWELS.has(ch)) return `<span style="color:#d62828">${ch}</span>`;

let mode = 'letters';
let idx = 0;

function setMode(newMode) {
  mode = newMode;
  idx = 0;
  document.getElementById('tabLetters').classList.toggle('active', mode === 'letters');
  document.getElementById('tabSyllables').classList.toggle('active', mode === 'syllables');
  document.getElementById('tabNumbers').classList.toggle('active', mode === 'numbers');
  render();
}

function go(newIdx) {
  const len = mode === 'letters' ? LETTERS.length : mode === 'syllables' ? SYLLABLES.length : NUMBERS.length;
  idx = (newIdx + len) % len;
  render();
}

function highlight(str, letChar) {
  const re = new RegExp(`(${letChar}|${letChar.toLowerCase()})`, 'g');
  return str.replace(re, `<b style="color:#d62828">$1</b>`);
}

function render() {
  const bar = document.getElementById('selectorBar');
  const grid = document.getElementById('comicGrid');

  if (mode === 'letters') {
    bar.innerHTML = LETTERS.map((item, i) =>
      `<button class="chip ${item.type} ${i === idx ? 'active' : ''}" onclick="go(${i})">${item.u}</button>`
    ).join('');

    const d = LETTERS[idx];
    const tc = d.type === 'vowel' ? 'vowel-txt' : d.type === 'cons' ? 'cons-txt' : 'sign-txt';
    const tl = d.type === 'vowel' ? 'эгшиг үсэг' : d.type === 'cons' ? 'гийгүүлэгч үсэг' : 'тэмдэг үсэг';
    const pool = ['А','Б','В','Г','Д','Е','Ж','З','И','Л','М','Н','О','Ө','Р','С','Т','У','Ү','Х','Ц','Ч','Ш','Э','Ю','Я'].filter(x => x !== d.u);
    const quizSet = [d.u, pool[(idx*3)%pool.length], pool[(idx*5+1)%pool.length], d.u, pool[(idx*7+2)%pool.length], pool[(idx*2+4)%pool.length]];

    grid.innerHTML = `
      <section class="panel cover">
        <div class="ribbon">Үсгийн ид шид • №${idx + 1}</div>
        <div style="font-weight:900;color:#0c7b93;font-size:15px">МИНИЙ БЯЦХАН НОМЫН САН</div>
        <div class="big-symbol ${tc}">${d.u} ${d.l}</div>
        <div class="emoji-stage" style="font-size:56px">${d.hIco}</div>
        <div style="font-weight:800;font-size:15px">${d.hero} ба ${d.u} үсэг</div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">★</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">1. ${d.u} үсгийг танилцъя</div>
        <div class="big-symbol ${tc}" style="text-align:center;font-size:72px">${d.u} ${d.l}</div>
        <div class="bubble"><b>${d.rule}</b></div>
        <div class="bubble" style="background:#fffbeb">👧👦 «<b class="${tc}">${d.u}</b> гэж дуудъя!»</div>
        <div class="panel-footer"><span>Үсэг таних</span><span class="page-num">1</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">2. ${d.u} үсэгтэй үгс</div>
        <div class="word-cards">
          <div class="w-card"><span class="ico">${d.f1Ico}</span><strong>${highlight(d.f1, d.u)}</strong></div>
          <div class="w-card"><span class="ico">${d.f2Ico}</span><strong>${highlight(d.f2, d.u)}</strong></div>
          <div class="w-card"><span class="ico">${d.f3Ico}</span><strong>${highlight(d.f3, d.u)}</strong></div>
          <div class="w-card"><span class="ico">${d.f4Ico}</span><strong>${highlight(d.f4, d.u)}</strong></div>
        </div>
        <div class="panel-footer"><span>Шинэ үгс</span><span class="page-num">2</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">3. ${d.hero}-ийн адал явдал</div>
        <div class="bubble">${highlight(d.story, d.u)}</div>
        <div class="emoji-stage" style="font-size:54px">${d.hIco} 🎒</div>
        <div class="panel-footer"><span>Комикс үлгэр</span><span class="page-num">3</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">4. Найзуудтайгаа уулзав</div>
        <div class="bubble">${highlight(d.friends, d.u)}</div>
        <div class="emoji-stage" style="font-size:48px">${d.hIco} ${d.f1Ico} ${d.f2Ico}</div>
        <div class="panel-footer"><span>Харилцан яриа</span><span class="page-num">4</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">5. ${d.f4}-тай учрав</div>
        <div class="bubble">${highlight(d.meet, d.u)}</div>
        <div class="emoji-stage" style="font-size:48px">${d.hIco} 🤝 ${d.f4Ico}</div>
        <div class="panel-footer"><span>Үгийн утга</span><span class="page-num">5</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">6. Бид юу сурсан бэ?</div>
        <ul class="checklist">
          <li>✅ <b class="${tc}">${d.u}</b> — ${tl}.</li>
          <li>✅ ${d.rule}</li>
          <li>✅ <b>${d.hero}, ${d.f1}, ${d.f2}</b> зэрэг үгэнд ордог.</li>
        </ul>
        <div class="panel-footer"><span>Дүгнэлт</span><span class="page-num">6</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">7. Дасгал даалгавар</div>
        <div style="font-size:12.5px;font-weight:700">1. <span class="${tc}">${d.u}</span> үсгийг дугуйл:</div>
        <div class="quiz-btns">
          ${quizSet.map(ch => `<button class="q-btn" onclick="this.classList.add('${ch === d.u ? 'ok' : 'no'}')">${ch}</button>`).join('')}
        </div>
        <div style="font-size:12.5px;font-weight:700;margin-top:4px">2. Зургийг зөв үгтэй нь сонго:</div>
        <div class="match-row"><span>${d.f1Ico}</span><button onclick="this.classList.add('matched')">${d.f1}</button></div>
        <div class="match-row"><span>${d.f2Ico}</span><button onclick="this.classList.add('matched')">${d.f2}</button></div>
        <div style="font-size:12.5px;font-weight:700;margin-top:4px">3. Бичээрэй: <span class="${tc}" style="font-size:16px">${d.u} ${d.l} ____</span></div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">7</span></div>
      </section>
    `;
  } else if (mode === 'syllables') {
    bar.innerHTML = SYLLABLES.map((item, i) =>
      `<button class="chip syl ${i === idx ? 'active' : ''}" onclick="go(${i})">${item.code}</button>`
    ).join('');

    const d = SYLLABLES[idx];
    grid.innerHTML = `
      <section class="panel cover">
        <div class="ribbon">Үеэр унших ид шид • №${idx + 1}</div>
        <div style="font-weight:900;color:#0f766e;font-size:15px">МИНИЙ БЯЦХАН НОМЫН САН</div>
        <div class="big-symbol" style="font-size:46px;margin:10px 0">${colorizeLetters(d.code)}</div>
        <div class="emoji-stage" style="font-size:56px">${d.ico}</div>
        <div style="font-weight:800;font-size:14.5px">${d.title}</div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">★</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">1. Үеийн хүрд уншъя</div>
        <div class="syl-pills">
          ${d.pills.map(p => `<span class="syl-pill">${colorizeLetters(p)}</span>`).join('')}
        </div>
        <div class="bubble"><b>${d.rule}</b></div>
        <div class="panel-footer"><span>${d.typeName}</span><span class="page-num">1</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">2. Үеэр холбож уншъя</div>
        <div class="word-cards">
          <div class="w-card"><span class="ico">${d.w1Ico}</span><strong>${colorizeLetters(d.w1)}</strong></div>
          <div class="w-card"><span class="ico">${d.w2Ico}</span><strong>${colorizeLetters(d.w2)}</strong></div>
          <div class="w-card"><span class="ico">${d.w3Ico}</span><strong>${colorizeLetters(d.w3)}</strong></div>
          <div class="w-card"><span class="ico">${d.w4Ico}</span><strong>${colorizeLetters(d.w4)}</strong></div>
        </div>
        <div style="font-size:11.5px;text-align:center;color:#526779">🔴 Эгшиг &nbsp; 🔵 Гийгүүлэгч</div>
        <div class="panel-footer"><span>Үг бүтээх</span><span class="page-num">2</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">3. Комикс түүх</div>
        <div class="bubble">${d.story}</div>
        <div class="emoji-stage">${d.ico} 📖</div>
        <div class="panel-footer"><span>Уншлагын аялал</span><span class="page-num">3</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">4. Үе нийлүүлж уншъя</div>
        <div class="bubble">${d.dialog}</div>
        <div class="emoji-stage">${d.w1Ico} + ${d.w2Ico}</div>
        <div class="panel-footer"><span>Холбож унших</span><span class="page-num">4</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">5. Өгүүлбэр уншъя</div>
        <div class="bubble" style="background:#fffbeb;font-size:15px;font-weight:800;text-align:center">
          ${colorizeLetters(d.readText)}
        </div>
        <div style="font-size:12px;text-align:center;color:#0f766e;font-weight:700">👆 Үеэр таслалгүй, тод дуудаж уншаарай!</div>
        <div class="panel-footer"><span>Уран уншлага</span><span class="page-num">5</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">6. Бид юу сурсан бэ?</div>
        <ul class="checklist">
          <li>✅ <b>${d.typeName}</b>-ийг зөв дуудаж уншлаа.</li>
          <li>✅ Улаан (эгшиг), цэнхэр (гийгүүлэгч) үсгийг нийлүүлж үг бүтээлээ.</li>
          <li>✅ Богино өгүүлбэр уншиж чаддаг боллоо.</li>
        </ul>
        <div class="panel-footer"><span>Дүгнэлт</span><span class="page-num">6</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">7. Дасгал даалгавар</div>
        <div style="font-size:12.5px;font-weight:700">1. ${d.quizQ}</div>
        <div class="quiz-btns">
          ${d.quizOpts.map(opt => `<button class="q-btn" onclick="this.classList.add('${opt === d.quizAns ? 'ok' : 'no'}')">${opt}</button>`).join('')}
        </div>
        <div style="font-size:12.5px;font-weight:700;margin-top:5px">2. Уншаад дар:</div>
        <div class="match-row"><span>${d.w1Ico}</span><button onclick="this.classList.add('matched')">${d.w1}</button></div>
        <div class="match-row"><span>${d.w2Ico}</span><button onclick="this.classList.add('matched')">${d.w2}</button></div>
        <div style="font-size:12.5px;font-weight:700;margin-top:5px">3. Хуулж бичээрэй: <span style="color:#0f766e">${d.w1}</span></div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">7</span></div>
      </section>
    `;
  } else {
    bar.innerHTML = NUMBERS.map((item, i) =>
      `<button class="chip num ${i === idx ? 'active' : ''}" onclick="go(${i})">${item.n}</button>`
    ).join('');

    const d = NUMBERS[idx];
    let tfHtml = '<div class="ten-frame">';
    for (let i = 1; i <= 10; i++) {
      tfHtml += `<div class="tf-cell ${i <= d.n ? 'filled' : ''}">${i <= d.n ? d.ico : ''}</div>`;
    }
    tfHtml += '</div>';

    const repeatedIcons = Array(d.n).fill(d.ico).join(' ');
    const choices = [d.n, d.n === 1 ? 3 : d.n - 1, d.n === 10 ? 7 : d.n + 1, d.n === 5 ? 8 : 5];

    grid.innerHTML = `
      <section class="panel cover">
        <div class="ribbon">Тооны ид шид • №${d.n}</div>
        <div style="font-weight:900;color:#0c7b93;font-size:15px">МИНИЙ БЯЦХАН НОМЫН САН</div>
        <div class="big-symbol num-txt">${d.n}</div>
        <div style="font-size:19px;font-weight:900;color:#1d4ed8">${d.word}</div>
        <div class="emoji-stage" style="font-size:32px">${repeatedIcons}</div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">★</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">1. ${d.n}-ийн цифрийг танилцъя</div>
        <div class="big-symbol num-txt" style="text-align:center">${d.n} <span style="font-size:22px;color:#1d4ed8">(${d.word})</span></div>
        ${tfHtml}
        <div class="bubble"><b>${d.rule}</b></div>
        <div class="panel-footer"><span>Тоо ба хэмжээ</span><span class="page-num">1</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">2. ${d.n} ширхэг зүйлс</div>
        <div class="word-cards">
          <div class="w-card"><span class="ico">${d.ex1Ico}</span><strong>${d.ex1}</strong></div>
          <div class="w-card"><span class="ico">${d.ex2Ico}</span><strong>${d.ex2}</strong></div>
          <div class="w-card"><span class="ico">${d.ex3Ico}</span><strong>${d.ex3}</strong></div>
          <div class="w-card"><span class="ico">${d.ex4Ico}</span><strong>${d.ex4}</strong></div>
        </div>
        <div class="panel-footer"><span>Орчин тойрноо тоолъё</span><span class="page-num">2</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">3. ${d.hero}-ын адал явдал</div>
        <div class="bubble">${d.story}</div>
        <div class="emoji-stage" style="font-size:32px">${repeatedIcons}</div>
        <div class="panel-footer"><span>Комикс үлгэр</span><span class="page-num">3</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">4. ${d.n}-ийн найзууд</div>
        <div class="bubble">${d.friends}</div>
        <div class="emoji-stage" style="font-size:42px">${d.ex1Ico} 🤝 ${d.ex2Ico}</div>
        <div class="panel-footer"><span>Харьцуулалт: <b>${d.comp}</b></span><span class="page-num">4</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">5. ${d.n} хэрхэн бүтдэг вэ?</div>
        <div class="bubble">${d.meet}</div>
        <div style="text-align:center;font-weight:900;font-size:17px;color:#0c7b93;background:#f0f9ff;padding:8px;border-radius:12px">
          ${d.n === 1 ? '0 + 1 = 1' : `${d.n - 1} + 1 = ${d.n} &nbsp;|&nbsp; ${d.n} - 1 = ${d.n - 1}`}
        </div>
        <div class="panel-footer"><span>Нэмэх ба хасах</span><span class="page-num">5</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">6. Бид юу сурсан бэ?</div>
        <ul class="checklist">
          <li>✅ <b>${d.n} (${d.word})</b> цифрийг зөв таньж, бичиж сурлаа.</li>
          <li>✅ <b>${d.n}</b> ширхэг зүйлийг алдалгүй тоолдог боллоо.</li>
          <li>✅ Хөрш тоонууд: <b>${d.comp}</b>.</li>
        </ul>
        <div class="panel-footer"><span>Дүгнэлт</span><span class="page-num">6</span></div>
      </section>

      <section class="panel">
        <div class="ribbon">7. Дасгал даалгавар</div>
        <div style="font-size:12.5px;font-weight:700">1. Дүрсийг тоолоод зөв тоог дар:</div>
        <div style="text-align:center;font-size:19px;margin:4px 0">${repeatedIcons}</div>
        <div class="quiz-btns">
          ${choices.map(c => `<button class="q-btn" onclick="this.classList.add('${c === d.n ? 'ok' : 'no'}')">${c}</button>`).join('')}
        </div>
        <div style="font-size:12.5px;font-weight:700;margin-top:5px">2. Бодлогыг бод:</div>
        <div style="background:#f8fbfd;padding:5px 10px;border-radius:8px;font-weight:800;text-align:center">
          ${d.n === 1 ? '1 + 0 = [ 1 ]' : `${d.n - 1} + 1 = [ ? ]`}
        </div>
        <div style="font-size:12.5px;font-weight:700;margin-top:5px">3. Бичээрэй: <span class="num-txt" style="font-size:16px">${d.n} &nbsp; ${d.n} &nbsp; ____</span></div>
        <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">7</span></div>
      </section>
    `;
  }
}

document.getElementById('prevBtn').onclick = () => go(idx - 1);
document.getElementById('nextBtn').onclick = () => go(idx + 1);

render();
</script>
</body>
</html>
