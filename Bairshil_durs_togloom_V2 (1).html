<!doctype html><html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Байршил, дүрс — Тоглоом</title><style>body{font-family:Arial,sans-serif;background:#eaf6ff;color:#173b69;margin:0;text-align:center}main{max-width:850px;margin:25px auto;padding:24px;background:white;border-radius:24px;box-shadow:0 8px 25px #a3c9e2}h1{font-size:clamp(28px,5vw,46px)}#art{height:260px;display:flex;align-items:center;justify-content:center;gap:30px}button{font-size:24px;border:3px solid #4388c7;background:#fff;border-radius:18px;padding:16px;margin:8px;cursor:pointer;min-width:170px}button:hover,button:focus{background:#fff3bb}#msg{font-size:25px;min-height:45px;font-weight:bold}.circle{width:130px;height:130px;border-radius:50%;background:#ffc94b}.square{width:130px;height:130px;background:#4da9ef}.triangle{width:0;height:0;border-left:75px solid transparent;border-right:75px solid transparent;border-bottom:135px solid #ef7070}.box{width:160px;height:130px;background:#add6f2;border:4px solid #3372a3;position:relative}.ball{position:absolute;width:55px;height:55px;background:#ffcd4d;border-radius:50%;left:52px}.up{top:-70px}.down{bottom:-70px}.inside{top:35px}.small{font-size:17px;color:#506b80}</style></head><body><main><h1>🌟 Байршил, дүрс</h1><p class="small">1-р анги · Өөрөө сонгож, алдаагаа засаж сураарай</p><h2 id="question"></h2><div id="art"></div><div id="answers"></div><p id="msg" aria-live="polite"></p><button id="next" hidden>Дараагийн даалгавар →</button><p id="progress"></p></main><script>
const tasks=[{q:'Дугуй дүрсийг олоорой.',kind:'shapes',a:['Дугуй','Гурвалжин','Дөрвөлжин'],right:0},{q:'Гурвалжин дүрсийг олоорой.',kind:'shapes',a:['Дугуй','Гурвалжин','Дөрвөлжин'],right:1},{q:'Дөрвөлжин дүрсийг олоорой.',kind:'shapes',a:['Дугуй','Гурвалжин','Дөрвөлжин'],right:2},{q:'Шар дугуй хайрцгийн хаана байна вэ?',kind:'up',a:['Дээр','Доор','Дотор'],right:0},{q:'Шар дугуй хайрцгийн хаана байна вэ?',kind:'down',a:['Дээр','Доор','Дотор'],right:1},{q:'Шар дугуй хайрцгийн хаана байна вэ?',kind:'inside',a:['Дээр','Доор','Дотор'],right:2}];let i=0,score=0,solved=false;const el=id=>document.getElementById(id);function show(){let t=tasks[i];solved=false;el('question').textContent=t.q;el('art').innerHTML=t.kind==='shapes'?'<div class="circle"></div><div class="triangle"></div><div class="square"></div>':`<div class="box"><div class="ball ${t.kind}"></div></div>`;el('answers').innerHTML='';t.a.forEach((x,j)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(solved)return;if(j===t.right){solved=true;score++;el('msg').textContent='⭐ Зөв! Маш сайн!';el('msg').style.color='#16804c';el('next').hidden=false}else{el('msg').textContent='Дахин ажиглаад оролдоорой.';el('msg').style.color='#a64b26'}};el('answers').appendChild(b)});el('msg').textContent='';el('next').hidden=true;el('progress').textContent=`Даалгавар ${i+1} / ${tasks.length}`};function advance(){i++;if(i===tasks.length){el('question').textContent='🎉 Баяр хүргэе!';el('art').innerHTML='<span style="font-size:90px">🌟🌟🌟</span>';el('answers').innerHTML='';el('msg').textContent=`Чи ${score} даалгаврыг зөв гүйцэтгэлээ.`;el('next').textContent='Дахин тоглох';el('next').hidden=false;el('next').onclick=()=>{i=0;score=0;solved=false;el('next').textContent='Дараагийн даалгавар →';el('next').onclick=advance;show()};el('progress').textContent=''}else show()};el('next').onclick=advance;show();</script></body></html>
