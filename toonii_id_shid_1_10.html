<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тооны ид шид • 1–10 хүртэлх цифрийн комикс номын сан</title>
<style>
  :root {
    --bg: #eef7fb;
    --ink: #173042;
    --brand: #0c7b93;
    --brand2: #f48c06;
    --num: #e63946;
    --card: #ffffff;
    --border: #c5dce8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(135deg, #173042, #0c7b93);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 20px; }
  header small { display: block; opacity: .85; font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--ink);
    transition: transform .1s, background .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--brand2); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }

  .num-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .num-chip {
    min-width: 44px;
    height: 40px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: #f8fbfd;
    font-weight: 900;
    font-size: 17px;
    color: var(--brand);
    cursor: pointer;
  }
  .num-chip.active {
    background: var(--num);
    color: #fff;
    border-color: var(--num);
    transform: scale(1.08);
  }

  main { max-width: 1280px; margin: 18px auto; padding: 0 14px 40px; }

  .comic-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 1024px) { .comic-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .comic-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 3px solid #2b5876;
    border-radius: 18px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 330px;
    position: relative;
    box-shadow: 0 6px 16px rgba(23,48,66,.08);
  }
  .panel.cover {
    background: linear-gradient(180deg, #dff3ff 0%, #fff6d6 65%, #d8f3dc 100%);
    text-align: center;
  }
  .ribbon {
    background: linear-gradient(90deg, #ffba08, #faa307);
    color: #173042;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    margin-bottom: 8px;
  }
  .big-digit {
    font-size: 74px;
    font-weight: 900;
    line-height: 1.05;
    color: var(--num);
    margin: 4px 0;
    text-shadow: 2px 3px 0 rgba(0,0,0,.12);
  }
  .word-name {
    font-size: 20px;
    font-weight: 900;
    color: #1d4ed8;
    letter-spacing: 1px;
  }
  .emoji-stage {
    font-size: 36px;
    text-align: center;
    margin: 6px 0;
    line-height: 1.25;
    user-select: none;
  }
  .ten-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    background: #f1f5f9;
    border: 2px solid #94a3b8;
    border-radius: 10px;
    padding: 5px;
    margin: 6px auto;
    width: 100%;
    max-width: 210px;
  }
  .tf-cell {
    height: 24px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .tf-cell.filled { background: #ffe5e5; border-color: #e63946; }

  .word-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 6px 0;
  }
  .w-card {
    background: #f8fbfd;
    border: 1.5px solid #d5e6f0;
    border-radius: 12px;
    padding: 7px;
    text-align: center;
  }
  .w-card .ico { font-size: 22px; display: block; line-height: 1.2; }
  .w-card strong { font-size: 13px; }

  .bubble {
    background: #fff;
    border: 2px solid #8ecae6;
    border-radius: 16px;
    padding: 9px 11px;
    font-size: 13.5px;
    line-height: 1.4;
    margin: 6px 0;
  }
  .checklist {
    list-style: none;
    padding: 0;
    margin: 6px 0;
    font-size: 13.5px;
  }
  .checklist li {
    background: #f1faee;
    border-radius: 10px;
    padding: 7px 9px;
    margin-bottom: 6px;
  }

  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #d5e6f0;
    font-size: 11px;
    color: #64748b;
  }
  .page-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ffba08;
    color: #173042;
    font-weight: 800;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Quiz styles */
  .quiz-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 6px 0; }
  .q-btn {
    min-width: 34px; height: 34px; border-radius: 10px;
    border: 1.5px solid #94a3b8; background: #fff;
    font-weight: 800; font-size: 14px; cursor: pointer;
  }
  .q-btn.ok { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }
  .q-btn.no { background: #ffe5e5; border-color: #e63946; }

  @media print {
    header, .num-bar { display: none !important; }
    body { background: #fff; }
    main { margin: 0; padding: 0; max-width: 100%; }
    .comic-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .panel { min-height: 255px; break-inside: avoid; box-shadow: none; border-width: 2px; }
  }
</style>
</head>
<body>

  <div>

  </div>

    <button class="btn ghost" id="prevBtn">◀ Өмнөх тоо</button>
    <button class="btn ghost" id="nextBtn">Дараагийн тоо ▶</button>
    <button class="btn primary" onclick="window.print()">🖨️ Ном хэвлэх (A4)</button>

</header>

<nav class="num-bar" id="numBar"></nav>

<main>

let idx = 0;

  const repeatedIcons = Array(d.n).fill(d.ico).join(' ');

  const choices = [d.n, d.n === 1 ? 3 : d.n - 1, d.n === 10 ? 7 : d.n + 1, d.n === 5 ? 8 : 5];

      <div class="bubble">${d.story}</div>
      <div class="emoji-stage">${repeatedIcons}</div>
      <div class="panel-footer"><span>Үлгэрээр суралцъя</span><span class="page-num">3</span></div>

      <div class="ribbon">4. ${d.n}-ийн найзууд</div>
      <div class="bubble">${d.friends}</div>
      <div class="emoji-stage">${d.ex1Ico} 🤝 ${d.ex2Ico}</div>

      <div class="ribbon">5. ${d.n} хэрхэн бүтдэг вэ?</div>
      <div class="bubble">${d.meet}</div>
      <div style="text-align:center;font-weight:900;font-size:18px;color:#0c7b93;background:#f0f9ff;padding:8px;border-radius:12px">
        ${d.n === 1 ? '0 + 1 = 1' : `${d.n - 1} + 1 = ${d.n} &nbsp;|&nbsp; ${d.n} - 1 = ${d.n - 1}`}
      </div>
      <div class="panel-footer"><span>Нэмэх ба хасах</span><span class="page-num">5</span></div>
    </section>

    <!-- 6. Бид юу сурсан бэ? -->
    <section class="panel">
      <div class="ribbon">6. Бид юу сурсан бэ?</div>
      <ul class="checklist">
        <li>✅ <b>${d.n} (${d.word})</b> цифрийг зөв таньж, бичиж сурлаа.</li>
        <li>✅ <b>${d.n}</b> ширхэг зүйлийг алдалгүй тоолдог боллоо.</li>
        <li>✅ Хөрш тоонууд: <b>${d.comp}</b>.</li>
      </ul>
      <div class="panel-footer"><span>Дүгнэлт</span><span class="page-num">6</span></div>
    </section>

    <!-- 7. Дасгал даалгавар -->
    <section class="panel">
      <div class="ribbon">7. Дасгал даалгавар</div>
      <div style="font-size:12.5px;font-weight:700">1. Дүрсийг тоолоод зөв тоог дар:</div>
      <div style="text-align:center;font-size:20px;margin:4px 0">${repeatedIcons}</div>
      <div class="quiz-btns">
        ${choices.map(c => `<button class="q-btn" onclick="checkNum(this, ${c}, ${d.n})">${c}</button>`).join('')}
      </div>
      <div style="font-size:12.5px;font-weight:700;margin-top:6px">2. Бодлогыг бод:</div>
      <div style="background:#f8fbfd;padding:6px 10px;border-radius:8px;font-weight:800;text-align:center">
        ${d.n === 1 ? '1 + 0 = [ 1 ]' : `${d.n - 1} + 1 = [ ? ]`}
      </div>
      <div style="font-size:12.5px;font-weight:700;margin-top:6px">3. Цэвэр сайхан бичээрэй: <span style="color:#e63946;font-size:16px">${d.n} &nbsp; ${d.n} &nbsp; ____</span></div>
      <div class="panel-footer"><span>Гээгий багш</span><span class="page-num">7</span></div>
    </section>
  `;
}

function checkNum(btn, val, target) {
  if (val === target) btn.classList.add('ok');
  else btn.classList.add('no');
}

function go(newIdx) {
  idx = (newIdx + NUMS.length) % NUMS.length;
  render();
}

document.getElementById('prevBtn').onclick = () => go(idx - 1);
document.getElementById('nextBtn').onclick = () => go(idx + 1);

render();
</script>
</body>
</html>
