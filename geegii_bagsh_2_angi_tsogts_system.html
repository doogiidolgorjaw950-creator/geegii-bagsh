      { ico: "🎯", title: "Шалгах асуулт", body: "Монгол Улс хэдэн аймагтай вэ?", opts: ["18 аймаг", "21 аймаг", "25 аймаг"], ans: "21 аймаг" }
    ],
    visuals: [
      { tag: "УРГИЙН ОВОГ", big: "🌳 Удам угсаагаа мэдье", sub: "Өвөө, эмээгийнхээ нэрийг мэдэж байх" },
      { tag: "ЭХ ОРОН", big: "🇲🇳 21 Аймаг • Нийслэл", sub: "Төрсөн нутгаараа бахархъя" },
      { tag: "НИЙТИЙН СОЁЛ", big: "🚌 Ахмад настанд суудал тавьж өгье", sub: "Хүндэтгэл ба эелдэг харилцаа" },
      { tag: "ДҮРЭМ ЖУРАМ", big: "🚸 Гарцаар гарч, дүрмээ биелүүлье", sub: "Хариуцлагатай сурагч" }
    ],
    workbook: [
      "1. Миний танилцуулга: Ургийн овог: __________, Эцэг/эхийн нэр: __________, Миний нэр: __________",
      "2. Миний амьдардаг аймаг/хот: __________, сум/дүүрэг: __________, сургууль: __________",
      "3. Нийтийн эзэмшлийн эд зүйлсийг (сургуулийн ширээ сандал, тоглоомын талбай) хэрхэн хайрлах вэ? 2 өгүүлбэр бичээрэй."
    ]
  },

  // 5. ДҮРСЛЭХ УРЛАГ, ТЕХНОЛОГИ (2-р анги)
  {
    subject: "🎨 Дүрслэх урлаг, Технологи",
    lessonTitle: "Үндсэн ба Үүсмэл өнгө, Цаасан нугалбар (Оригами)",
    aim: "Улаан, шар, цэнхэр үндсэн өнгөнөөс үүсмэл өнгө (улбар шар, ногоон, ягаан) гарган авч, цаасаар дүрс нугалж бүтээнэ.",
    materials: "Усан будаг/гуаш, бийр, өнгийн цаас, хайч, цавуу",
    steps: [
      { stage: "1. Сэдэлжүүлэлт", time: "5 мин", teacher: "Солонго хэдэн өнгөтэй вэ? Улаан ба шар будгийг холивол ямар өнгө гарах вэ? гэж асууна.", student: "Улбар шар өнгө үүснэ гэж таамаглана." },
      { stage: "2. Шинэ мэдлэг", time: "15 мин", teacher: "3 үндсэн өнгө (Улаан, Шар, Цэнхэр)-ийг хооронд нь хольж үүсмэл өнгө гаргах туршилт үзүүлнэ.", student: "Будгийн тавган дээр Шар+Цэнхэр=Ногоон, Улаан+Цэнхэр=Ягаан өнгө гарган зурна." },
      { stage: "3. Бүтээл хийх", time: "15 мин", teacher: "Дөрвөлжин өнгийн цаасаар «Завь» эсвэл «Эрвээхэй» нугалах дарааллыг алхамчлан үзүүлнэ.", student: "Технологийн дарааллын дагуу цаасаа тэгш нугалж бүтээлээ хийнэ." },
      { stage: "4. Үзэсгэлэн ба Дүгнэлт", time: "5 мин", teacher: "Сурагчдын бүтээлээр ангийн үзэсгэлэн гаргаж урамшуулна.", student: "Өөрийн болон найзынхаа бүтээлийг үнэлнэ." }
    ],
    slides: [
      { ico: "🎨", title: "Үндсэн 3 Өнгө", body: "Бусад өнгийг хольж гаргах боломжгүй 3 үндсэн өнгө:<br><b style='font-size:24px'>🔴 Улаан &nbsp;•&nbsp; 🟡 Шар &nbsp;•&nbsp; 🔵 Цэнхэр</b>" },

      { ico: "🎯", title: "Шалгах асуулт", body: "Шар ба цэнхэр өнгийг холивол ямар өнгө үүсэх вэ?", opts: ["Улбар шар", "Ногоон", "Ягаан"], ans: "Ногоон" }

      { tag: "ӨНГӨНИЙ ХОЛИМОГ 2", big: "🟡 + 🔵 = 🟢", sub: "Шар + Цэнхэр = Ногоон" },
      { tag: "АЮУЛГҮЙ АЖИЛЛАГАА", big: "✂️ Хайч, цавуутай зөв харьцъя", sub: "Ажлын байраа цэвэр байлгая" }
    ],
    workbook: [
      "1. Өнгөний нийлбэрийг нөхөж будаарай: а) Улаан + Шар = ________  б) Шар + Цэнхэр = ________  в) Улаан + Цэнхэр = ________",
      "2. Халуун өнгөнүүдийг нэрлээрэй (нар, галтай төстэй): 1) ________  2) ________  3) ________",
      "3. Бүтээлч даалгавар: Дөрвөлжин цаасаар завь нугалж, дэвтрийнхээ доод хэсэгт наагаад далайн давалгаа зурж чимэглээрэй."
    ]
  }

let tab = 0; // 0 = Ээлжит хичээл, 1 = Цахим хичээл, 2 = Хэрэглэгдэхүүн, 3 = Дасгал ажил
let subjIdx = 0;
let slideIdx = 0;
let quizMsg = "";

function setTab(t) {
  tab = t;
  [0, 1, 2, 3].forEach(i => document.getElementById(`t${i}`).classList.toggle('active', i === t));
  render();
}

function selectSubj(s) {
  subjIdx = s;
  slideIdx = 0;
  quizMsg = "";
  render();
}

function checkSlideQuiz(chosen, ans) {
  quizMsg = chosen === ans ? "🌟 Яг зөв! Гайхалтай!" : "❌ Дахин бодоод үзээрэй!";
  render();
}

function render() {
  const main = document.getElementById('mainArea');
  const cur = GRADE2_DATA[subjIdx];

  const subjBar = `
    <div class="subj-bar">
      <div class="subj-pills">
        ${GRADE2_DATA.map((d, i) => `
          <button class="pill ${i === subjIdx ? 'active' : ''}" onclick="selectSubj(${i})">${d.subject}</button>
        `).join('')}
      </div>
      ${tab !== 1 ? `<button class="btn btn-warm" onclick="window.print()">🖨️ Хэвлэх (A4)</button>` : ''}
    </div>
  `;

  let bodyHtml = "";

  if (tab === 0) {
    // 1. ЭЭЛЖИТ ХИЧЭЭЛИЙН ТӨЛӨВЛӨЛТ
    bodyHtml = `
      <div class="a4-page">
        <div class="a4-head">
          <h2>📋 Ээлжит хичээлийн төлөвлөлт: ${cur.lessonTitle}</h2>
          <div style="font-size:12.5px;font-weight:800">2-р анги • 40 минут • ${cur.subject}</div>
        </div>
        <div style="background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55">
          <b>🎯 Зорилго:</b> ${cur.aim}<br>
          <b>🧰 Хэрэглэгдэхүүн:</b> ${cur.materials}
        </div>
        <table class="plan-tbl">
          <thead>
            <tr>
              <th style="width:140px">Үе шат</th>
              <th style="width:70px">Хугацаа</th>
              <th>Багшийн үйл ажиллагаа</th>
              <th>Сурагчийн үйл ажиллагаа</th>
            </tr>
          </thead>
          <tbody>
            ${cur.steps.map(s => `
              <tr>
                <td><b>${s.stage}</b></td>
                <td><b>${s.time}</b></td>
                <td>${s.teacher}</td>
                <td>${s.student}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    `;
  } else if (tab === 1) {
    // 2. ЦАХИМ ХИЧЭЭЛ (СЛАЙД)
    const sl = cur.slides[slideIdx];
    const qHtml = sl.opts ? `
      <div style="margin-top:14px">
        ${sl.opts.map(o => `
          <button class="q-opt ${quizMsg.includes('зөв') && o === sl.ans ? 'ok' : ''}"
                  onclick="checkSlideQuiz('${o}', '${sl.ans}')">${o}</button>
        `).join('')}
      </div>
      <div style="min-height:24px;margin-top:8px;font-size:16px;font-weight:900;color:${quizMsg.includes('зөв') ? '#16a34a' : '#dc2626'}">${quizMsg}</div>
    ` : '';

    bodyHtml = `
      <div class="slide-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:900;color:#0369a1;border-bottom:2px dashed #bae6fd;padding-bottom:8px">
          <span>${cur.subject} • 2-р анги</span>
          <span>Слайд ${slideIdx + 1} / ${cur.slides.length}</span>
        </div>
        <div style="padding:16px 0">
          <div class="slide-ico">${sl.ico}</div>
          <h2 style="margin:0 0 12px;font-size:24px">${sl.title}</h2>
          <div class="slide-content">${sl.body}${qHtml}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #bae6fd;padding-top:12px">
          <button class="btn" style="background:#64748b" ${slideIdx === 0 ? 'disabled' : ''} onclick="slideIdx--;quizMsg='';render()">◀ Өмнөх</button>
          <span style="font-size:13px;font-weight:800;color:#475569">${cur.lessonTitle}</span>
          <button class="btn btn-warm" ${slideIdx + 1 >= cur.slides.length ? 'disabled' : ''} onclick="slideIdx++;quizMsg='';render()">Дараах ▶</button>
        </div>
      </div>
    `;
  } else if (tab === 2) {
    // 3. ХЭРЭГЛЭГДЭХҮҮН (A4 КАРТ)
    bodyHtml = `
      <div class="a4-page">
        <div class="a4-head">
          <h2>🃏 Самбарын Хэрэглэгдэхүүн: ${cur.subject} (2-р анги)</h2>
          <div style="font-size:12.5px;font-weight:800">Хайчлаад самбарт наах үзүүлэн карт ✂️</div>
        </div>
        <div class="cards-grid">
          ${cur.visuals.map(v => `
            <div class="v-card">
              <div style="font-size:11.5px;font-weight:900;color:#64748b;margin-bottom:8px">${v.tag}</div>
              <div style="font-size:28px;font-weight:900;color:#0c7b93;margin:12px 0">${v.big}</div>
              <div style="font-size:14.5px;font-weight:800;color:#334155">${v.sub}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    // 4. ДАСГАЛ АЖЛЫН ДЭВТЭР (A4)
    bodyHtml = `
      <div class="a4-page">
        <div class="a4-head">
          <h2>📓 Дасгал Ажлын Дэвтэр: ${cur.subject} (2-р анги)</h2>
          <div style="font-size:12.5px;font-weight:800">Нэр: ______________________ &nbsp;|&nbsp; Огноо: 2026.__.__</div>
        </div>
        ${cur.workbook.map((task, idx) => `
          <div class="wb-box">
            <h4>Дасгал ${idx + 1}</h4>
            <div style="font-size:15px;font-weight:800;margin-bottom:10px;line-height:1.55">${task}</div>
            <div class="ruled"></div>
            <div class="ruled"></div>
          </div>
        `).join('')}
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-top:10px">
          <span>Багшийн үнэлгээ: ⭐ Онц &nbsp; 👍 Сайн &nbsp; 💪 Хичээгээрэй</span>
          <span>Урамшууллын од: ⭐⭐⭐⭐⭐</span>
        </div>
      </div>
    `;
  }

  main.innerHTML = subjBar + bodyHtml;
}

render();
</script>
