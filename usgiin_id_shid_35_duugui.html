<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Үсгийн ид шид • 35 үсгийн комикс номын сан</title>
<style>
  :root {
    --bg: #eef7fb;
    --ink: #173042;
    --brand: #0c7b93;
    --brand2: #f48c06;
    --vowel: #d62828;
    --cons: #1d4ed8;
    --sign: #6d28d9;
    --card: #ffffff;
    --border: #c5dce8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    background: linear-gradient(135deg, #173042, #0c7b93);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  header h1 { margin: 0; font-size: 20px; }
  header small { display: block; opacity: .85; font-size: 12px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    border: 0;
    border-radius: 10px;
    padding: 8px 14px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    color: var(--ink);
    transition: transform .1s, background .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.primary { background: var(--brand2); color: #fff; }
  .btn.ghost { background: rgba(255,255,255,.16); color: #fff; }

  .alphabet-bar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
  }
  .let-chip {
    min-width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: #f8fbfd;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
  .let-chip.vowel { color: var(--vowel); }
  .let-chip.cons { color: var(--cons); }
  .let-chip.sign { color: var(--sign); }
  .let-chip.active {
    background: var(--ink);
    color: #fff !important;
    border-color: var(--ink);
    transform: scale(1.08);
  }

  main { max-width: 1280px; margin: 18px auto; padding: 0 14px 40px; }

  /* 8-panel comic grid (4x2) */
  .comic-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 1024px) { .comic-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 580px) { .comic-grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--card);
    border: 3px solid #2b5876;
    border-radius: 18px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 320px;
    position: relative;
    box-shadow: 0 6px 16px rgba(23,48,66,.08);
  }
  .panel.cover {
    background: linear-gradient(180deg, #dff3ff 0%, #fff6d6 65%, #d8f3dc 100%);
    text-align: center;
  }
  .ribbon {
    background: linear-gradient(90deg, #ffba08, #faa307);
    color: #173042;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 10px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
    margin-bottom: 8px;
  }
  .big-letter {
    font-size: 68px;
    font-weight: 900;
    line-height: 1.05;
    margin: 6px 0;
    text-shadow: 2px 3px 0 rgba(0,0,0,.1);
  }
  .vowel-txt { color: var(--vowel); }
  .cons-txt { color: var(--cons); }
  .sign-txt { color: var(--sign); }

  .emoji-stage {
    font-size: 56px;
    text-align: center;
    margin: 6px 0;
    user-select: none;
  }
  .word-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 6px 0;
  }
  .w-card {
    background: #f8fbfd;
    border: 1.5px solid #d5e6f0;
    border-radius: 12px;
    padding: 7px;
    text-align: center;
  }
  .w-card .ico { font-size: 28px; display: block; }
  .w-card strong { font-size: 15px; }

  .bubble {
    background: #fff;
    border: 2px solid #8ecae6;
    border-radius: 16px;
    padding: 9px 11px;
    font-size: 13.5px;
    line-height: 1.4;
    margin: 6px 0;
  }
  .checklist {
    list-style: none;
    padding: 0;
    margin: 6px 0;
    font-size: 13.5px;
  }
  .checklist li {
    background: #f1faee;
    border-radius: 10px;
    padding: 7px 9px;
    margin-bottom: 6px;
  }

  .panel-footer {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #d5e6f0;
  }
  .page-num {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ffba08;
    font-weight: 800;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Quiz styles */
  .quiz-letters { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin: 6px 0; }
  .q-let {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid #94a3b8; background: #fff;
    font-weight: 800; cursor: pointer;
  }
  .q-let.ok { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }
  .q-let.no { background: #ffe5e5; border-color: #e63946; }
  .match-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #f8fbfd; border-radius: 8px; padding: 4px 8px; margin: 4px 0; font-size: 13px;
  }
  .match-row button {
    border: 1px solid #94a3b8; background: #fff; border-radius: 6px; padding: 2px 7px; cursor: pointer; font-weight: 700;
  }
  .match-row button.matched { background: #2a9d8f; color: #fff; border-color: #2a9d8f; }

  @media print {
    header, .alphabet-bar { display: none !important; }
    body { background: #fff; }
    main { margin: 0; padding: 0; max-width: 100%; }
    .comic-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .panel { min-height: 255px; break-inside: avoid; box-shadow: none; border-width: 2px; }
  }
</style>
</head>
