let tab = 0, subjIdx = 0, slideIdx = 0, quizMsg = "";
function setTab(t) { tab = t; [0,1,2,3].forEach(i => document.getElementById(`t${i}`).classList.toggle('active', i === t)); render(); }
function selectSubj(s) { subjIdx = s; slideIdx = 0; quizMsg = ""; render(); }
function checkSlideQuiz(chosen, ans) { quizMsg = chosen === ans ? "🌟 Яг зөв! Гайхалтай!" : "❌ Дахин бодоод үзээрэй!"; render(); }

function render() {
  const main = document.getElementById('mainArea');
  const cur = GRADE4_DATA[subjIdx];
  const subjBar = `
    <div class="subj-bar">
      <div class="subj-pills">${GRADE4_DATA.map((d, i) => `<button class="pill ${i === subjIdx ? 'active' : ''}" onclick="selectSubj(${i})">${d.subject}</button>`).join('')}</div>
      ${tab !== 1 ? `<button class="btn btn-warm" onclick="window.print()">🖨️ Хэвлэх (A4)</button>` : ''}
    </div>
  `;

  let bodyHtml = "";
  if (tab === 0) {
    bodyHtml = `
      <div class="a4-page">
        <div class="a4-head"><h2>📋 Ээлжит хичээлийн төлөвлөлт: ${cur.lessonTitle}</h2><div style="font-size:12.5px;font-weight:800">4-р анги • 40 минут • ${cur.subject}</div></div>
        <div style="background:#f8fafc;border:1.5px solid #cbd5e1;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;line-height:1.55"><b>🎯 Зорилго:</b> ${cur.aim}<br><b>🧰 Хэрэглэгдэхүүн:</b> ${cur.materials}</div>
        <table class="plan-tbl">
          <thead><tr><th style="width:140px">Үе шат</th><th style="width:70px">Хугацаа</th><th>Багшийн үйл ажиллагаа</th><th>Сурагчийн үйл ажиллагаа</th></tr></thead>
          <tbody>${cur.steps.map(s => `<tr><td><b>${s.stage}</b></td><td><b>${s.time}</b></td><td>${s.teacher}</td><td>${s.student}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    `;
  } else if (tab === 1) {
    const sl = cur.slides[slideIdx];
    const qHtml = sl.opts ? `<div style="margin-top:14px">${sl.opts.map(o => `<button class="q-opt ${quizMsg.includes('зөв') && o === sl.ans ? 'ok' : ''}" onclick="checkSlideQuiz('${o}', '${sl.ans}')">${o}</button>`).join('')}</div><div style="min-height:24px;margin-top:8px;font-size:16px;font-weight:900;color:${quizMsg.includes('зөв') ? '#16a34a' : '#dc2626'}">${quizMsg}</div>` : '';
    bodyHtml = `
      <div class="slide-box">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:900;color:#5b21b6;border-bottom:2px dashed #ddd6fe;padding-bottom:8px"><span>${cur.subject} • 4-р анги</span><span>Слайд ${slideIdx + 1} / ${cur.slides.length}</span></div>
        <div style="padding:16px 0"><div class="slide-ico">${sl.ico}</div><h2 style="margin:0 0 12px;font-size:24px">${sl.title}</h2><div class="slide-content">${sl.body}${qHtml}</div></div>
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:2px dashed #ddd6fe;padding-top:12px">
          <button class="btn" style="background:#64748b" ${slideIdx === 0 ? 'disabled' : ''} onclick="slideIdx--;quizMsg='';render()">◀ Өмнөх</button>
          <span style="font-size:13px;font-weight:800;color:#475569">${cur.lessonTitle}</span>
          <button class="btn btn-warm" ${slideIdx + 1 >= cur.slides.length ? 'disabled' : ''} onclick="slideIdx++;quizMsg='';render()">Дараах ▶</button>
        </div>
      </div>
    `;
  } else if (tab === 2) {
    bodyHtml = `
      <div class="a4-page">
        <div class="a4-head"><h2>🃏 Самбарын Хэрэглэгдэхүүн: ${cur.subject} (4-р анги)</h2><div style="font-size:12.5px;font-weight:800">Хайчлаад самбарт наах үзүүлэн карт ✂️</div></div>
        <div class="cards-grid">${cur.visuals.map(v => `<div class="v-card"><div style="font-size:11.5px;font-weight:900;color:#64748b;margin-bottom:8px">${v.tag}</div><div style="font-size:28px;font-weight:900;color:#6d28d9;margin:12px 0">${v.big}</div><div style="font-size:14.5px;font-weight:800;color:#334155">${v.sub}</div></div>`).join('')}</div>

        ${cur.workbook.map((task, idx) => `<div class="wb-box"><h4>Дасгал ${idx + 1}</h4><div style="font-size:15px;font-weight:800;margin-bottom:10px;line-height:1.55">${task}</div><div class="ruled"></div><div class="ruled"></div></div>`).join('')}

    `;
  }
  main.innerHTML = subjBar + bodyHtml;
}
